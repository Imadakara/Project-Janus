services:
  db:
    image: postgres:16-alpine
    container_name: janus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-janus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-janus_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-project_janus}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - janus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  janus_postgres_data:
